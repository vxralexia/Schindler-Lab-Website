# Keeps the Publications page up to date and publishes the website.
#
#  - Every Monday it asks OpenAlex for Corinna's new papers, adds them to
#    data/publications.js, and saves that change to this repository.
#  - Every time you upload/commit changes, it republishes the site.
#  - You can also run it any time: Actions tab -> "Update publications and
#    publish site" -> Run workflow.
#
# Requires (one-time setup):
#  - Settings -> Pages -> Source: "GitHub Actions"
#  - Settings -> Secrets and variables -> Actions -> New repository secret:
#      name OPENALEX_API_KEY, value = your free key from openalex.org/settings/api

name: Update publications and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1"   # Mondays, ~1:17 am Vancouver time
  workflow_dispatch:        # "Run workflow" button

permissions:
  contents: write   # to save newly found papers
  pages: write      # to publish the site
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get the website files
        uses: actions/checkout@v4

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Look for new papers on OpenAlex
        if: github.event_name != 'push'
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          SCHINDLER_ORCID: ${{ vars.SCHINDLER_ORCID }}
        run: python scripts/update_publications.py

      - name: Save new papers to the repository
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain data/publications.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.js
            git commit -m "Add new publications from OpenAlex"
            git push
          else
            echo "No changes to save."
          fi

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5

      - name: Package the website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
